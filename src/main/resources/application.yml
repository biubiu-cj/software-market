server:
  port: 8080

spring:
  application:
    name: software-market

  # 本地开发默认激活 local，自动加载 application-local.yml（内含真实密钥，已被 .gitignore 忽略）。
  # 服务器上通过环境变量覆盖：SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/software_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all + 幂等生产者: 保证 leader 落盘且 ISR 同步后才确认, 重试不会产生重复消息
      acks: all
      enable-idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "software_market.event"

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  # 上传文件根目录。本地开发用相对路径（相对启动目录）；
  # 服务器上请改绝对路径并确保运行用户有写权限，例如 /opt/software-market/upload
  upload-dir: ${UPLOAD_DIR:./upload}
  ai:
    analysis-cache-minutes: ${AI_ANALYSIS_CACHE_MINUTES:30}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:5}
  cors:
    # 允许跨域的前端来源（逗号分隔），生产环境必须通过环境变量配置真实域名，禁止使用 "*"
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# agent-service 是独立进程，仅监听内网；前端不能直接访问 8090。
agent:
  service:
    enabled: ${AGENT_SERVICE_ENABLED:true}
    base-url: ${AGENT_SERVICE_BASE_URL:http://127.0.0.1:8090}
    token: ${AGENT_SERVICE_TOKEN:dev-token}
    connect-timeout: 2s
    read-timeout: 60s

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: software_market.entity

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    software_market: debug

jwt:
  secret: ${JWT_SECRET:}
  access-token-expire: 7d
  refresh-token-expire: 30d
  oauth2-access-token-expire: 1h

wechat:
  appid: ${WECHAT_APPID:your_wechat_appid}
  secret: ${WECHAT_SECRET:your_wechat_appsecret}
  redirect-uri: ${WECHAT_REDIRECT_URI:http://localhost:8080/api/auth/wechat/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
