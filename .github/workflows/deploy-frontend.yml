name: Deploy Frontend

# 前端改动 push 到 master 时自动构建并部署；
# 也可在 GitHub 网页 Actions 页手动点击 Run workflow 触发。
on:
  push:
    branches: [master]
    paths:
      - 'fronted/newSSE/**'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted/newSSE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定（与本地开发保持一致）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: fronted/newSSE/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fronted/newSSE/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build 脚本 = vue-tsc && vite build（类型检查不过就不会部署）
      - name: Build
        run: pnpm build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist to server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/software-market/www/
